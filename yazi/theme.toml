# Catppuccin Mocha theme for Yazi
# https://github.com/catppuccin/yazi

[mgr]
cwd = { fg = "#94e2d5", italic = true }

# Hovered / Selected
hovered         = { bg = "#313244", bold = true }
preview_hovered = { bg = "#313244" }

# Find
find_keyword  = { fg = "#f9e2af", bold = true, italic = true, underline = true }
find_position = { fg = "#f5c2e7", bold = true }

# Marker
marker_copied   = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut      = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked   = { fg = "#89dceb", bg = "#89dceb" }
marker_selected = { fg = "#89b4fa", bg = "#89b4fa" }

# Tab
tab_active   = { fg = "#11111b", bg = "#cba6f7", bold = true }
tab_inactive = { fg = "#cdd6f4", bg = "#313244" }
tab_width    = 1

# Count
count_copied   = { fg = "#11111b", bg = "#a6e3a1" }
count_cut      = { fg = "#11111b", bg = "#f38ba8" }
count_selected = { fg = "#11111b", bg = "#89b4fa" }

# Border
border_symbol = "│"
border_style  = { fg = "#585b70" }

[status]
separator_open  = ""
separator_close = ""
separator_style = { fg = "#313244", bg = "#313244" }

# Mode
mode_normal = { fg = "#11111b", bg = "#89b4fa", bold = true }
mode_select = { fg = "#11111b", bg = "#a6e3a1", bold = true }
mode_unset  = { fg = "#11111b", bg = "#f38ba8", bold = true }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#89b4fa", bg = "#313244" }
progress_error  = { fg = "#f38ba8", bg = "#313244" }

# Permissions
permissions_t = { fg = "#89b4fa" }
permissions_r = { fg = "#f9e2af" }
permissions_w = { fg = "#f38ba8" }
permissions_x = { fg = "#a6e3a1" }
permissions_s = { fg = "#6c7086" }

[input]
border   = { fg = "#89b4fa" }
title    = {}
value    = {}
selected = { reversed = true }

[select]
border   = { fg = "#89b4fa" }
active   = { fg = "#f5c2e7", bold = true }
inactive = {}

[which]
cols            = 3
mask            = { bg = "#181825" }
cand            = { fg = "#89dceb" }
rest            = { fg = "#9399b2" }
desc            = { fg = "#f5c2e7" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
on      = { fg = "#f5c2e7" }
run     = { fg = "#89dceb" }
desc    = { fg = "#cdd6f4" }
hovered = { bg = "#313244", bold = true }
footer  = { fg = "#11111b", bg = "#cdd6f4" }

[filetype]
rules = [
	# Media
	{ mime = "image/*", fg = "#94e2d5" },
	{ mime = "{audio,video}/*", fg = "#f9e2af" },

	# Archives
	{ mime = "application/*zip", fg = "#f38ba8" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#f38ba8" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#a6e3a1" },

	# Fallback
	{ name = "*", fg = "#cdd6f4" },
	{ name = "*/", fg = "#89b4fa", bold = true },
]
