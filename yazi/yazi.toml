# Yazi Configuration
# https://yazi-rs.github.io/docs/configuration/yazi

[mgr]
show_hidden = true
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size"

[preview]
tab_size = 2
max_width = 1200
max_height = 1200
image_filter = "triangle"
image_quality = 80
sixel_fraction = 15
