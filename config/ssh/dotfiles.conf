# Shared SSH defaults (macOS, Linux & WSL). Pulled in by an Include line at the top of
# ~/.ssh/config (added by the installer or `dot doctor --fix`); host entries stay in ~/.ssh/config.

Host *
    # Load a key into the running agent on first use, so its passphrase is asked once per agent
    AddKeysToAgent yes
    # macOS: remember passphrases in the login keychain (Linux OpenSSH skips the unknown option)
    IgnoreUnknown UseKeychain
    UseKeychain yes
    # Keep connections alive across Wi-Fi switches and laptop sleep
    ServerAliveInterval 60
    ServerAliveCountMax 3
    # Multiplex SSH connections so subsequent git fetch/push/ssh calls skip the handshake.
    # %C hashes (%l%h%p%r) to a 40-char SHA-1 token so long hostnames never hit macOS's 104-byte socket limit.
    ControlMaster auto
    ControlPath ~/.ssh/sockets/%C
    ControlPersist 10m
