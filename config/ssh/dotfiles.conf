# Shared SSH defaults (macOS, Linux & WSL). Pulled in by an Include line at the top of
# ~/.ssh/config (added by the installer or `dot doctor --fix`); host entries stay in ~/.ssh/config.

Host *
    # Load a key into the running agent on first use, so its passphrase is asked once per agent
    AddKeysToAgent yes
    # macOS: remember passphrases in the login keychain (Linux OpenSSH skips the unknown option)
    IgnoreUnknown UseKeychain
    UseKeychain yes
