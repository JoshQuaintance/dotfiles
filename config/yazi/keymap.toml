# Yazi Keymaps Configuration
# https://yazi-rs.github.io/docs/configuration/keymap

[[mgr.prepend_keymap]]
on   = [ "T" ]
run  = '''shell --confirm '
  if [ -n "$TMUX" ]; then
    tmux new-window -c "$PWD"
  elif [ -n "$ZELLIJ" ]; then
    zellij action new-tab --cwd "$PWD"
  elif [ "$TERM_PROGRAM" = "WezTerm" ] && command -v wezterm >/dev/null 2>&1; then
    wezterm cli spawn --cwd "$PWD" >/dev/null
  elif [ -n "$KITTY_LISTEN_ON" ] && command -v kitty >/dev/null 2>&1; then
    kitty @ launch --type=tab --cwd="$PWD" >/dev/null
  elif [ "$(uname -s)" = "Darwin" ]; then
    if [ "$TERM_PROGRAM" = "ghostty" ] || [ -d "/Applications/Ghostty.app" ]; then
      osascript - "$PWD" <<APPLESCRIPT >/dev/null 2>&1
on run argv
  set targetDir to item 1 of argv
  tell application "Ghostty"
    set cfg to new surface configuration
    set initial working directory of cfg to targetDir
    if (count of windows) > 0 then
      new tab in front window with configuration cfg
    else
      new window with configuration cfg
    end if
    activate
  end tell
end run
APPLESCRIPT
    elif [ "$TERM_PROGRAM" = "iTerm.app" ]; then
      open -a iTerm "$PWD"
    else
      open -a Terminal "$PWD"
    fi
  elif [ -n "$WT_SESSION" ] && command -v wt.exe >/dev/null 2>&1; then
    wt.exe -w 0 nt -d "$PWD"
  elif command -v gnome-terminal >/dev/null 2>&1; then
    gnome-terminal --tab --working-directory="$PWD"
  elif command -v konsole >/dev/null 2>&1; then
    konsole --new-tab --workdir "$PWD"
  elif command -v xfce4-terminal >/dev/null 2>&1; then
    xfce4-terminal --tab --working-directory="$PWD"
  fi
' '''
desc = "Open new terminal tab in current directory"

[[mgr.prepend_keymap]]
on   = [ "L" ]
run  = 'shell "lazygit" --block --confirm'
desc = "Open lazygit in current directory"

[[mgr.prepend_keymap]]
on   = [ "Y" ]
run  = [ "copy path", "unyank" ]
desc = "Copy absolute path to system clipboard"

[[mgr.prepend_keymap]]
on   = [ "c", "c" ]
run  = '''shell --confirm '
  cat "$@" | if command -v pbcopy >/dev/null 2>&1; then
    pbcopy
  elif [ -n "$WSL_DISTRO_NAME" ] && command -v win32yank.exe >/dev/null 2>&1; then
    win32yank.exe -i --crlf
  elif [ -n "$WAYLAND_DISPLAY" ] && command -v wl-copy >/dev/null 2>&1; then
    wl-copy
  elif [ -n "$DISPLAY" ] && command -v xclip >/dev/null 2>&1; then
    xclip -selection clipboard
  elif [ -n "$DISPLAY" ] && command -v xsel >/dev/null 2>&1; then
    xsel --clipboard --input
  elif command -v clip.exe >/dev/null 2>&1; then
    { printf "\xff\xfe"; iconv -f UTF-8 -t UTF-16LE; } | clip.exe
  elif [ -n "$TMUX" ]; then
    tmux load-buffer -
  fi
' '''
desc = "Copy selected file contents to system clipboard"

[[mgr.prepend_keymap]]
on   = [ "D" ]
run  = 'shell "nvim -d %s" --block --confirm'
desc = "Diff selected files side-by-side in Neovim"

[[mgr.prepend_keymap]]
on   = [ "x" ]
run  = 'shell "ouch decompress --here -y %s" --confirm'
desc = "Extract archive(s) in current directory via ouch"

[[mgr.prepend_keymap]]
on   = [ "E" ]
run  = 'shell "set -- %s; nvim \"${@:-.}\"" --block --confirm'
desc = "Open selected item or directory in Neovim"

[[mgr.prepend_keymap]]
on   = [ "V" ]
run  = 'shell "set -- %s; code \"${@:-.}\"" --confirm'
desc = "Open selected item or directory in VS Code"

[[mgr.prepend_keymap]]
on   = [ "<C-q>" ]
run  = "quit --no-cwd-file"
desc = "Quit without changing directory"

[[mgr.prepend_keymap]]
on   = [ "g", "r" ]
run  = 'shell "ya emit cd \"$(git rev-parse --show-toplevel 2>/dev/null || pwd)\"" --confirm'
desc = "Jump to current Git repository root"

[[mgr.prepend_keymap]]
on   = [ "g", "w" ]
run  = '''shell --block --confirm '
  target="$(git worktree list 2>/dev/null | fzf --height=100% --reverse --prompt="🌳 Worktree > " | awk "{print \$1}")"
  [ -n "$target" ] && ya emit cd "$target"
' '''
desc = "Jump to a Git worktree via FZF"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = '''shell --block --confirm '
  target="$(git status --porcelain=v1 2>/dev/null | fzf --height=100% --reverse --prompt="📝 Git Status > " --preview="f=\$(printf \"%s\" {} | cut -c4-); f=\${f##* -> }; git diff --color=always -- \"\$f\" 2>/dev/null | head -n 100" | cut -c4-)"
  target="${target##* -> }"
  [ -n "$target" ] && ya emit reveal "$target"
' '''
desc = "Jump to a modified Git file via FZF"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/.dotfiles"
desc = "Jump to ~/.dotfiles"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/Codes"
desc = "Jump to ~/Codes"

[[mgr.prepend_keymap]]
on   = [ "g", "v" ]
run  = "cd ~/Documents/tolaria"
desc = "Jump to Tolaria notes vault"
